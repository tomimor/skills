<!doctype html>
<!-- 1200x630 og:image template. Replace the CSS variables and copy with the
     project's brand before rendering with scripts/render-og-image.mjs.
     Keep total text short: the card renders at ~500px wide in most feeds. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0b1220;            /* brand background */
    --fg: #f8fafc;            /* headline color */
    --muted: #94a3b8;         /* secondary text */
    --accent: #3b82f6;        /* brand accent */
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg);
  }
  .logo { display: flex; align-items: center; gap: 20px; }
  .logo img { width: 64px; height: 64px; border-radius: 14px; }
  .logo span { font-size: 32px; font-weight: 600; color: var(--muted); }
  h1 { font-size: 76px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; max-width: 20ch; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 28px; color: var(--muted); }
  .accent-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--accent); }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="logo">
    <!-- <img src="logo.png" alt="" /> -->
    <span>SITE NAME</span>
  </div>
  <h1>Headline that sells the site in one line</h1>
  <div class="footer">
    <div class="url">example.com</div>
  </div>
</body>
</html>
