<!doctype html>
<!-- 1200x630 og:image template — default layout: logo + centered headline.
     Works with any logo and brand color and survives square center crops.
     Fill the CSS variables, point the <img> at the project's logo (SVG or
     PNG next to this file), and render with scripts/render-og-image.mjs.
     Rules (references/og-image-design.md): never print the URL/domain or the
     site name — the logo is the brand; headline 5-7 words, <=60 chars. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Headless Chromium on Linux resolves system-ui to DejaVu: point this at
     the brand font (local file next to the template) when there is one. */
  /* @font-face { font-family: Brand; src: url(./brand.woff2); font-weight: 400 800; } */
  :root {
    --bg: #0b1220;            /* full-bleed, never transparent */
    --fg: #f8fafc;            /* headline, >=4.5:1 against --bg */
    --font: Brand, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
    padding: 80px 120px 130px;   /* extra bottom: X overlays text there */
    background: var(--bg); color: var(--fg); font-family: var(--font); text-align: center;
  }
  .logo { height: 96px; width: auto; max-width: 480px; }
  h1 {
    font-size: 80px; font-weight: 700; line-height: 1.08; letter-spacing: -0.03em; max-width: 18ch;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  /* shrink long headlines instead of overflowing; never below 56px */
  h1.long { font-size: 68px; }
  h1.xlong { font-size: 56px; }
</style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="" />
  <h1>Headline that sells the site in one line</h1>
  <script>
    const h1 = document.querySelector('h1');
    const n = h1.textContent.trim().length;
    if (n > 50) h1.classList.add('xlong');
    else if (n > 30) h1.classList.add('long');
  </script>
</body>
</html>
