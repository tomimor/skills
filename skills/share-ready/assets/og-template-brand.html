<!doctype html>
<!-- 1200x630 og:image template — brand variant: full-bleed brand color, small
     logo top-left, big left-aligned headline, the logo mark oversized and
     translucent bleeding off the right edge. Use only when the brand has a
     strong primary color AND a simple, recognizable mark (icon, not a
     wordmark); otherwise use og-template.html. If the logo carries its own
     background, use a single-color version of the mark for .mark.
     Same rules as og-template.html: no URL, no site name, 5-7 word headline. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  /* @font-face { font-family: Brand; src: url(./brand.woff2); font-weight: 400 800; } */
  :root {
    --bg: #3b82f6;            /* brand primary, full-bleed */
    --fg: #ffffff;            /* headline, >=4.5:1 against --bg */
    --font: Brand, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    padding: 72px 80px 120px;    /* extra bottom: X overlays text there */
    background: var(--bg); color: var(--fg); font-family: var(--font);
  }
  /* on the brand color use a white/single-color version of the logo */
  .logo { height: 64px; width: auto; align-self: flex-start; }
  .mark {
    position: absolute; right: -140px; top: 50%; width: 560px; height: 560px;
    transform: translateY(-50%) rotate(-8deg); opacity: 0.22; mix-blend-mode: screen;
  }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  h1 {
    font-size: 92px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; max-width: 13ch;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  h1.long { font-size: 76px; max-width: 15ch; }
  h1.xlong { font-size: 60px; max-width: 18ch; }
</style>
</head>
<body>
  <img class="mark" src="logo.svg" alt="" />
  <img class="logo" src="logo.svg" alt="" />
  <div class="main"><h1>Headline that sells the site in one line</h1></div>
  <script>
    const h1 = document.querySelector('h1');
    const n = h1.textContent.trim().length;
    if (n > 40) h1.classList.add('xlong');
    else if (n > 25) h1.classList.add('long');
  </script>
</body>
</html>
